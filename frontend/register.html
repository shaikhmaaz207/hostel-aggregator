<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <!-- SEO Meta Tags -->
  <meta name="description" content="Create your HostelFinder account as a student or hostel owner."/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta property="og:title" content="Register — HostelFinder"/>
  <meta property="og:description" content="Join HostelFinder as a student or hostel owner."/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — HostelFinder</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/login.css"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-brand">🏠 HostelFinder</div>
    <div class="nav-links">
      <a href="index.html">← Browse</a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <!-- REGISTER FORM -->
  <div class="login-page">
    <div class="login-card">

      <div class="login-header">
        <div class="login-icon">🏠</div>
        <h1>Create Account</h1>
        <p>Join HostelFinder today</p>
      </div>

      <!-- ROLE SELECTOR -->
      <div class="role-selector">
        <button class="role-btn active" id="roleStudent"
          onclick="selectRole('Student')">
          🎓 I'm a Student
        </button>
        <button class="role-btn" id="roleOwner"
          onclick="selectRole('Owner')">
          🏠 I'm an Owner
        </button>
      </div>

      <input type="hidden" id="selectedRole" value="Student"/>

      <!-- FORM FIELDS -->
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName"
          placeholder="Enter your full name"/>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="regEmail"
          placeholder="Enter your email"/>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword"
          placeholder="Create a password"/>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="regConfirm"
          placeholder="Confirm your password"/>
      </div>

      <!-- ERROR & SUCCESS -->
      <div id="regError"   class="login-error"   style="display:none;"></div>
      <div id="regSuccess" class="login-success" style="display:none;"></div>

      <!-- SUBMIT -->
      <button class="btn-login" id="regBtn" onclick="register()">
        Create Account
      </button>

      <div class="login-footer">
        Already have an account?
        <a href="login.html">Login here</a>
      </div>

    </div>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
