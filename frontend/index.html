<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HostelFinder — Find Your Perfect PG</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-brand">🏠 HostelFinder</div>
    <div class="nav-links">
      <a href="#">Browse</a>
      <a href="login.html">Login</a>
      <a href="#" class="btn-register">Register</a>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-content">
      <h1>Find Your Home Away From Home</h1>
      <p>Browse verified hostels and PGs near your college</p>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by name or location..." />
        <button onclick="filterHostels()">Search</button>
      </div>
    </div>
  </section>

  <!-- FILTERS -->
  <section class="filters">
    <div class="container">
      <span class="filter-label">Filter by:</span>
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('Student', this)">Boys</button>
      <button class="filter-btn" onclick="setFilter('Girl', this)">Girls</button>
      <button class="filter-btn" onclick="setFilter('budget', this)">Under ₹5000</button>
    </div>
  </section>

  <!-- HOSTEL CARDS GRID -->
  <section class="browse-section">
    <div class="container">
      <h2 class="section-title">Available Hostels <span id="count"></span></h2>
      <div class="hostel-grid" id="hostelGrid">
        <!-- Cards injected by JS -->
      </div>
      <p class="no-results" id="noResults" style="display:none;">
        No hostels found. Try a different search.
      </p>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 HostelFinder · Built for students, by students</p>
  </footer>

  <script src="js/app.js"></script>

</body>
</html>
