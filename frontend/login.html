<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — HostelFinder</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/login.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">🏠 HostelFinder</div>
    <div class="nav-links">
      <a href="index.html">← Browse</a>
    </div>
  </nav>

  <div class="login-container">
    <div class="login-box">
      <div class="login-icon">🔑</div>
      <h1>Welcome Back</h1>
      <p class="login-subtitle">Login to your HostelFinder account</p>

      <div id="errorMsg" class="error-msg" style="display:none;"></div>
      <div id="successMsg" class="success-msg" style="display:none;"></div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="owner@example.com"/>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password"/>
      </div>

      <button class="btn-login" onclick="login()">Login</button>

      <p class="login-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </div>
  </div>

  <script src="js/login.js"></script>

</body>
</html>
